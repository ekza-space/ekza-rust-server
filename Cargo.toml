[package]
name = "server"
version = "0.1.0"
edition = "2021"
default-run = "server"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rust_socketio = { version = "0.6.0", features = ["async"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socketioxide = { version = "0.18.1", features = ["state", "tracing", "v4"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
bs58 = "0.5"
rand = "0.8"
solana-pubkey = { version = "2.4", default-features = false, features = ["std", "curve25519"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
default = []
agents = ["dep:rust_socketio"]

[[bin]]
name = "agent_bot"
path = "src/bin/agent_bot.rs"
required-features = ["agents"]

[[bin]]
name = "agent_bridge"
path = "src/bin/agent_bridge.rs"
required-features = ["agents"]

[[bin]]
name = "world_agent"
path = "src/bin/world_agent.rs"
required-features = ["agents"]
